apiVersion: v1
kind: Pod

metadata:
  name: model-loader
  namespace: mlops

spec:
  restartPolicy: Never

  containers:

  - name: loader

    image: busybox

    command:
      - sleep
      - "3600"

    volumeMounts:

    - name: model-storage
      mountPath: /models

  volumes:

  - name: model-storage

    persistentVolumeClaim:
      claimName: mlops-pvc