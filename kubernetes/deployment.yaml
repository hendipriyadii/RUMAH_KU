apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secret
  namespace: mlops
type: Opaque
stringData:
  APP_SECRET: REPLACE_WITH_YOUR_APP_SECRET
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD_HASH: REPLACE_WITH_YOUR_ADMIN_PASSWORD_HASH
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-pvc
  namespace: mlops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-deployment
  namespace: mlops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mlops
  template:
    metadata:
      labels:
        app: mlops
    spec:
      containers:
      - name: mlops-container
        image: mlops_deploy:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model-storage
          mountPath: /models
        env:
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: mlops-secret
              key: APP_SECRET
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlops-secret
              key: ADMIN_USERNAME
        - name: ADMIN_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: mlops-secret
              key: ADMIN_PASSWORD_HASH
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: mlops-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-service
  namespace: mlops
spec:
  selector:
    app: mlops
  type: NodePort
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
