apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: mlops-ingress
  namespace: mlops

spec:
  ingressClassName: nginx

  rules:
    - host: mlops.local

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: mlops-service

                port:

                  number: 80