apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: mlops-hpa
  namespace: mlops

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlops-deployment

  minReplicas: 1

  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization

          averageUtilization: 50